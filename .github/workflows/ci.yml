name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Mainline gate: Linux product-module tests, parallelized across modules.
# Superseded runs are cancelled so the newest commit gets the fastest feedback.
# | 主线门禁：Linux 产品模块测试，按模块并行；旧运行会被取消，让最新提交最快得到结果。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: '**/go.sum'
      # `go test` compiles every package, so a separate `go build` is redundant.
      # Four modules run at a time; Go's test cache and build cache are safe under
      # concurrent invocations. | `go test` 会编译全部包，无需再单独 `go build`；
      # 每次并行 4 个模块，Go 的测试与构建缓存在并发下是安全的。
      - name: Vet and test product modules
        shell: bash
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          find . -name go.mod -not -path './.git/*' -not -path './benchmarks/*' -print0 |
            xargs -0 -n1 -P 4 bash -c '
              set -e
              dir=$(dirname "$1")
              echo "==> $dir"
              cd "$dir"
              go vet ./...
              go test ./... -count=1 -timeout=10m
            ' _
      # Benchmark modules are compile-checked on the mainline; their actual tests
      # run asynchronously in ci-extra. `-run "^$"` still links test binaries, which
      # catches missing assembly symbols without paying the benchmark runtime cost.
      # | 主线只对基准模块做编译检查（含测试二进制链接），实际测试在 ci-extra 异步运行。
      - name: Vet and compile benchmark modules
        shell: bash
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          find ./benchmarks -name go.mod -print0 |
            xargs -0 -n1 -P 4 bash -c '
              set -e
              dir=$(dirname "$1")
              echo "==> $dir"
              cd "$dir"
              go vet ./...
              go test ./... -run "^$" -count=1 -timeout=10m
            ' _