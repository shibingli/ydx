SecRuleEngine On
SecRequestBodyAccess On

SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto" "id:1001,phase:1,deny,status:403,log,msg:'scanner'"
SecRule REQUEST_METHOD "@rx ^TRACE$" "id:1002,phase:1,deny,status:405,log,msg:'trace'"
SecRule ARGS "@rx (?i)(?:union\s+select|['\"]\s*(?:or|and)\s+['\"]?[0-9]|\bsleep\s*\()" "id:1101,phase:2,deny,status:403,log,msg:'sqli'"
SecRule ARGS "@rx (?i)(?:<script|onerror\s*=|javascript:)" "id:1201,phase:2,deny,status:403,log,msg:'xss'"
SecRule ARGS|REQUEST_URI "@rx (?i)(?:\.\./|%2e%2e%2f|/etc/passwd|\bcmd\.exe\b)" "id:1301,phase:2,deny,status:403,log,msg:'lfi'"
SecRule ARGS "@rx (?i)(?:;\s*cat\s|\|\s*whoami|\$\(id\))" "id:1401,phase:2,deny,status:403,log,msg:'rce'"
